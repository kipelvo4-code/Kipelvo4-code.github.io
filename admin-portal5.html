  .brand-title{font-size:1.2rem;font-weight:700;color:#fbbf24;display:flex;align-items:center;justify-content:center;gap:.5rem;margin:0}

  .icon-btn{background:none;border:0;color:#f1f5f9;font-size:1.8rem;line-height:1;padding:.2rem .6rem;border-radius:.5rem;cursor:pointer;flex:none;position:relative}
  .icon-btn:hover{background:#334155}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s ease;z-index:200}

<script>
const { useState, useEffect } = React;
const html = htm.bind(React.createElement);
/* ---- Live activity / debug log: kept in memory and shown in Settings > Account & Security > Account & Device Management ---- */
const QLOG = (() => { const items = [], subs = new Set(); let n = 0;
  const push = (level, msg, src) => { try { items.push({ id: ++n, t: Date.now(), level, src: src || "app", msg: String(msg).slice(0, 500) }); if (items.length > 400) items.shift(); subs.forEach((f) => { try { f(); } catch (e) {} }); } catch (e) {} };
  return { items, push, sub: (f) => { subs.add(f); return () => subs.delete(f); }, clear: () => { items.length = 0; subs.forEach((f) => { try { f(); } catch (e) {} }); } }; })();
const useQlog = () => { const [, bump] = useState(0); useEffect(() => QLOG.sub(() => bump((n) => n + 1)), []); return QLOG.items; };
["warn", "error"].forEach((lv) => { const o = console[lv]; console[lv] = function () { try { QLOG.push(lv, Array.from(arguments).map((a) => (a instanceof Error ? a.message : typeof a === "string" ? a : JSON.stringify(a))).join(" "), "console"); } catch (e) {} return o.apply(console, arguments); }; });
window.addEventListener("error", (e) => QLOG.push("error", (e.message || "Script error") + (e.filename ? " @" + String(e.filename).split("/").pop() + ":" + e.lineno : ""), "window"));
window.addEventListener("unhandledrejection", (e) => QLOG.push("error", "Unhandled promise: " + ((e.reason && e.reason.message) || e.reason), "promise"));
QLOG.push("info", "Portal loaded", "app");
/* A random id kept on this device, so an unauthorized device can be blocked even after it logs out */
const DEVID = (() => { try { let d = localStorage.getItem("agc_device_id"); if (!d) { d = crypto.randomUUID(); localStorage.setItem("agc_device_id", d); } return d; } catch (e) { return "tmp-" + crypto.randomUUID(); } })();
// SHA-256 of the admin password (lowercased). Convenience gate only: anyone who can read this file can bypass it.
const ADMIN_HASH = "8b3ce0c3977ee6e8d53efeb1fb5b4f82bfb85e44b706c4eded197bd78875da67";
const BRAND = "beQuofy"; // change this one word to rebrand the title, header, footer and backup name
const ORG_ID = "main_organization"; // organizationId for the global election lock: /elections/main_organization/status
const KEY = "agc_admin_payments", DB = "agc_admin_db";
const hashPw = async (v) => Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(String(v).trim().toLowerCase()))), (b) => b.toString(16).padStart(2, "0")).join("");
const newCode = () => "VOTE-" + Array.from(crypto.getRandomValues(new Uint8Array(6)), (b) => "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[b % 32]).join("");
const clean = (v, n) => String(v ?? "").trim().replace(/[\u0000-\u001F\u007F]/g, "").slice(0, n);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const TEST_MODE = /[?&]test=1\b|#test\b/.test(location.search + location.hash); // add ?test=1 to the page address to enable test tools
const uid = () => crypto.randomUUID(), now = () => new Date().toISOString();
const device = () => (/Android|iPhone|iPad/.exec(navigator.userAgent) || ["Desktop"])[0];
const fmt = (t) => new Date(t).toLocaleString();
const inp = "w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500";
const btn = "bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl transition-all";
const sbtn = "bg-slate-700 hover:bg-slate-600 text-white text-xs font-semibold px-3 py-2 rounded-lg";
const dbtn = "bg-red-600/80 hover:bg-red-500 text-white text-xs font-semibold px-3 py-2 rounded-lg";
const card = "bg-slate-800/80 border border-slate-700 rounded-2xl p-5 shadow-xl";
const row = "bg-slate-900 p-3 rounded-xl border border-slate-800 flex flex-wrap items-center justify-between gap-2 text-xs text-slate-400";
const blank = { churches: [], subs: [], election: null, voters: [], votes: [], audit: [], voted: [], candidates: [], cs: {}, requests: [] };
const L = (d, action, detail) => ({ ...d, audit: [{ id: uid(), time: now(), action, detail }, ...d.audit].slice(0, 1000) });
const cname = (d, id) => (d.churches.find((c) => c.id === id) || { name: "(removed)" }).name;
const Title = ({ children }) => html`<h2 className="text-lg font-bold text-amber-300 mb-3">${children}</h2>`;

const ICONS = {
  Churches: ['text-amber-400', '<rect x="3.5" y="3" width="11" height="18" rx="1.8" fill="#38bdf8" stroke="#0369a1"/><rect x="14.5" y="9" width="6.5" height="12" rx="1.6" fill="#a78bfa" stroke="#6d28d9"/><rect x="6" y="5.8" width="2.2" height="2.2" rx=".4" fill="#fde047" stroke="none"/><rect x="9.8" y="5.8" width="2.2" height="2.2" rx=".4" fill="#fde047" stroke="none"/><rect x="6" y="10" width="2.2" height="2.2" rx=".4" fill="#fde047" stroke="none"/><rect x="9.8" y="10" width="2.2" height="2.2" rx=".4" fill="#fde047" stroke="none"/><rect x="16.2" y="12" width="1.8" height="1.8" rx=".3" fill="#fef3c7" stroke="none"/><rect x="16.2" y="15.5" width="1.8" height="1.8" rx=".3" fill="#fef3c7" stroke="none"/><rect x="7.6" y="15.2" width="3.4" height="5.8" rx=".8" fill="#fb923c" stroke="#c2410c" stroke-width="1.2"/><path d="M1.5 21.5h21" stroke="#34d399" stroke-width="2.2"/>'],

    if (!(await checkAdmin(f.cur))) { QLOG.push("warn", "Password change refused: current password was wrong", "security"); return say("Current password is incorrect."); }
    if (f.nw.trim().length < 8) return say("New password must be at least 8 characters.");
    if (f.nw.trim() !== f.cf.trim()) return say("New passwords do not match.");
    try { await A().setHash(await hashExact(f.nw)); upd((d) => L(d, "Admin password changed", "")); QLOG.push("info", "Admin password changed", "security"); setF({ cur: "", nw: "", cf: "" }); await rv(sess.filter((x) => x.id !== sid).map((x) => x.id)); say("Password changed. Other devices were signed out."); } catch (x) { say("Could not save: " + x.message); }
  };
  const block = async (x) => {
    if (!A()) return say("Still connecting to Firebase. Try again."); if (!x.dev) return say("This is an older session without a device ID. Use Logout instead."); if (x.dev === DEVID) return say("You can't block the device you are using.");
    if (!confirm("Block " + x.device + "? It will be signed out and cannot unlock the dashboard until you unblock it.")) return;
    try { await devOps.block(x); upd((d) => L(d, "Device blocked", x.device + " · " + x.loc)); QLOG.push("warn", "Blocked device: " + x.device + " (" + x.loc + ")", "devices"); say("Device blocked and signed out."); } catch (e) { say("Could not block: " + e.message); }
  };
  const unblock = async (b) => { if (!A()) return say("Still connecting to Firebase. Try again."); if (!confirm("Unblock " + (b.device || "this device") + "?")) return; try { await devOps.unblock(b); upd((d) => L(d, "Device unblocked", (b.device || "") + " · " + (b.loc || ""))); QLOG.push("info", "Unblocked device: " + (b.device || b.id), "devices"); say("Device unblocked."); } catch (e) { say("Could not unblock: " + e.message); } };
  const all = quoLogEntries(db), shown = (flt === "all" ? all : flt === "error" ? all.filter((e) => e.level !== "info") : all.filter((e) => e.src === flt)).slice(0, 120);
  const lvl = { error: "text-red-300", warn: "text-amber-300", info: "text-slate-300" }, line = (e) => new Date(e.t).toLocaleTimeString() + " [" + e.level + "/" + e.src + "] " + e.msg;
  return html`<${Sec} title="Account & Device Management">
    <div id="acct-password" className="space-y-3"><p className="text-sm font-bold text-white">🔑 Change admin password</p>
      <form onSubmit=${change} className="grid grid-cols-1 sm:grid-cols-3 gap-3">${[["cur", "Current password"], ["nw", "New password (8+ characters)"], ["cf", "Confirm new password"]].map(([k, p]) => html`<input key=${k} type="password" required placeholder=${p} value=${f[k]} onChange=${(e) => setF({ ...f, [k]: e.target.value })} className=${inp} />`)}
        <button className=${btn + " sm:col-span-3 py-2.5 text-sm"}>Change password</button></form></div>
    <div id="acct-devices" className="space-y-2">
      <div className="flex flex-wrap items-center justify-between gap-2"><p className="text-sm text-white font-semibold">📱 ${online.length} device${online.length === 1 ? "" : "s"} logged in</p><button onClick=${() => confirm("Sign out every device, including this one?") && rv(live.map((x) => x.id), "All devices signed out.")} className=${dbtn}>Logout all devices</button></div>
      ${live.length === 0 && html`<p className="text-sm text-slate-500 italic">No sessions yet.</p>`}
      ${live.map((x, i) => html`<div key=${x.id} className=${row}><span><strong className="text-white">${i + 1}. ${x.device}</strong> ${x.id === sid && html`<span className="text-[10px] border border-amber-500/40 bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full">This device</span>`}<br />${x.loc} (from device time zone) · ${Date.now() - seen(x) < 180000 ? "Online now" : "Last seen " + fmt(seen(x))}<br /><span className="text-[10px] text-slate-500">${x.dev ? "Device ID " + String(x.dev).slice(0, 8) : "Older session (no device ID)"}</span></span>
        <span className="flex gap-2"><button onClick=${() => rv([x.id], "Device signed out.")} className=${dbtn}>Logout</button>${x.dev && x.dev !== DEVID && html`<button onClick=${() => block(x)} className=${dbtn}>Block</button>`}</span></div>`)}
      <p className="text-sm text-white font-semibold pt-2">⛔ Blocked devices (${blockedDev.length})</p>
      ${blockedDev.length === 0 && html`<p className="text-xs text-slate-500 italic">No blocked devices.</p>`}
      ${blockedDev.map((b) => html`<div key=${b.id} className=${row}><span><strong className="text-white">${b.device || "Device"}</strong><br />${b.loc || ""}${b.at ? " · blocked " + fmt(b.at) : ""}</span><button onClick=${() => unblock(b)} className=${sbtn}>Unblock</button></div>`)}
      <p className="text-xs text-slate-500">A blocked device is signed out and refused at the unlock screen. This check runs in the browser, so for full protection also keep your Firebase rules locked down.</p></div>
    <div id="acct-log" className="space-y-2">
      <div className="flex flex-wrap items-center justify-between gap-2"><p className="text-sm text-white font-semibold flex items-center gap-2"><span className="w-2.5 h-2.5 rounded-full bg-emerald-400 live-dot inline-block"></span>Live activity & debug log</p>
        <span className="flex gap-2"><button onClick=${() => copyText(shown.map(line).join("\n"), say)} className=${sbtn}>Copy</button><button onClick=${() => saveFile(shown.map(line).join("\n"), "activity-log.txt", "text/plain")} className=${sbtn}>Download</button><button onClick=${() => QLOG.clear()} className=${sbtn}>Clear</button></span></div>
      <div className="flex flex-wrap gap-2">${[["all", "All"], ["error", "Errors & warnings"], ["quo", "Quo AI"], ["devices", "Devices"], ["audit", "Admin actions"]].map(([k, n]) => html`<button key=${k} onClick=${() => setFlt(k)} className=${flt === k ? btn + " px-3 py-1.5 text-xs" : sbtn}>${n}</button>`)}</div>
      <div className="bg-slate-950 border border-slate-800 rounded-xl p-2 max-h-72 overflow-y-auto font-mono text-[11px] space-y-0.5">${shown.length === 0 && html`<p className="text-slate-500 italic">No activity yet.</p>`}
        ${shown.map((e, i) => html`<div key=${i + "-" + e.t} className=${(lvl[e.level] || "text-slate-300") + " break-words"}><span className="text-slate-500">${new Date(e.t).toLocaleTimeString()}</span> <span className="text-slate-500">[${e.src}]</span> ${e.msg}</div>`)}</div>
      <p className="text-xs text-slate-500">Updates live: sign-ins, device actions, Quo AI activity, navigation, connection status and script errors since this page was opened, plus recent admin actions.</p></div><//>`;
}

function Passcodes({ db, upd, say }) {
  const [shown, setShown] = useState(null);
  const change = async (sb) => {
    if (!confirm(`Change the passcode for ${sb.name}? The old passcode stops working immediately.`)) return;
    let pw = newCode().slice(5), hash = await hashPw(pw); while (db.subs.some((x) => x.hash === hash)) { pw = newCode().slice(5); hash = await hashPw(pw); }
    upd((d) => L({ ...d, subs: d.subs.map((x) => (x.id === sb.id ? { ...x, hash } : x)) }, "Passcode changed", sb.user)); ISSUED[sb.churchId] = pw; setShown({ id: sb.id, pw });
  };
  const emailSub = (c, s) => { const rq = db.requests.find((q) => q.churchId === s.churchId), em = rq ? clean(rq.email, 120) : "", pw = ISSUED[s.churchId];
    say(!em ? "No email address is on file for this organization. The mail app opens with the To field empty." : pw ? "Opening your email app with the passcode filled in." : "The old passcode cannot be shown again. Tap Change passcode first, then Send Email.");
    sendMail(mailDraft(em, rq ? clean(rq.name, 60) : c.name, pw), say); };
  return html`<${Sec} title="Organization Passcodes">
    <p className="text-xs text-slate-500">Passcodes are stored as one-way hashes, so an existing passcode cannot be viewed. Change it to generate a new one, shown here once with a Copy button.</p>
    ${db.churches.length === 0 && html`<p className="text-sm text-slate-500 italic">No churches yet.</p>`}
    ${db.churches.map((c) => html`<div key=${c.id} className="space-y-2"><p className="text-sm font-bold text-white">${c.name}</p>
      ${db.subs.filter((s) => s.churchId === c.id).length === 0 && html`<p className="text-xs text-slate-500 italic">No sub-admin for this church.</p>`}
      ${db.subs.filter((s) => s.churchId === c.id).map((s) => html`<div key=${s.id} className=${row}><span>${s.name} · ${s.user} · Passcode: <span className="font-mono text-amber-300">${shown && shown.id === s.id ? shown.pw : "••••••••"}</span></span>
        <span className="flex flex-wrap gap-2">${shown && shown.id === s.id && html`<button onClick=${() => copyText(shown.pw, say)} className=${sbtn}>Copy</button><button onClick=${() => { delete ISSUED[s.churchId]; setShown(null); }} className=${sbtn}>Hide</button>`}<button type="button" onClick=${() => emailSub(c, s)} aria-label=${"Send email to " + s.name} title="Open an email to this organization" className=${sbtn}>✉ Send Email</button><button onClick=${() => change(s)} className=${btn + " text-xs px-3 py-2"}>Change passcode</button></span></div>`)}</div>`)}<//>`;
}

function SystemCfg({ say, upd, sys }) {
  const [n, setN] = useState(sys.name || ""), A = () => window.agcAdmin;
  useEffect(() => setN(sys.name || ""), [sys.name]);
  const fail = (x) => say("Could not save: " + x.message);
  const saveName = (e) => { e.preventDefault(); const name = clean(n, 40); if (name.length < 2) return say("Enter a system name (2+ characters)."); if (!A()) return say("Still connecting to Firebase."); A().setSystem({ name }).then(() => { upd((d) => L(d, "System name changed", name)); say("System name saved."); }).catch(fail); };
  const logo = (e) => {
    const file = e.target.files[0]; e.target.value = ""; if (!file) return;
    if (!/^image\/(png|jpeg|webp)$/.test(file.type) || file.size > 5e6) return say("Choose a PNG, JPG or WebP image under 5 MB.");
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const s = Math.min(1, 128 / Math.max(img.width, img.height)), c = document.createElement("canvas"); c.width = Math.max(1, Math.round(img.width * s)); c.height = Math.max(1, Math.round(img.height * s)); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      A().setSystem({ logo: c.toDataURL("image/png") }).then(() => { upd((d) => L(d, "System logo changed", "")); say("Logo updated."); }).catch(fail); };
    img.onerror = () => say("That image could not be read."); img.src = u;
  };
  const backup = async () => { if (!A()) return say("Still connecting to Firebase."); try { saveFile(JSON.stringify(await A().backup(), null, 2), BRAND.toLowerCase() + "-backup-" + new Date().toISOString().slice(0, 10) + ".json", "application/json"); upd((d) => L(d, "Database backup downloaded", "")); } catch (x) { fail(x); } };
  return html`<${Sec} title="System">
    <form onSubmit=${saveName} className="flex gap-3"><input placeholder="System name" value=${n} onChange=${(e) => setN(e.target.value)} className=${inp} /><button className=${btn + " px-5 text-sm"}>Save</button></form>
    <div className="flex flex-wrap items-center gap-3"><img src=${sys.logo || LOGO_FULL} alt="Logo" className="w-12 h-12 rounded-xl object-contain bg-slate-900" />
      <label className=${sbtn + " cursor-pointer"}>Upload logo<input type="file" accept="image/png,image/jpeg,image/webp" onChange=${logo} className="hidden" /></label>
      ${sys.logo && html`<button onClick=${() => A().setSystem({ logo: null }).then(() => say("Logo removed.")).catch(fail)} className=${dbtn}>Remove logo</button>`}</div>
    <div><button onClick=${backup} className=${sbtn}>Backup database (JSON)</button><p className="text-xs text-slate-500 mt-2">The backup contains voter codes, vote records and login hashes. Store it somewhere private.</p></div><//>`;
}

function Support({ db, upd }) {
  const [q, setQ] = useState(""), voted = new Set(db.voted.map((x) => x.id)), vs = db.voters.filter((v) => voted.has(v.id) && v.name.toLowerCase().includes(q.trim().toLowerCase())).slice(0, 50);
  const reset = (v) => { if (confirm(`Reset ${v.name}? They will be able to vote again. Ballots are anonymous, so their earlier vote stays counted. Use this only if their vote failed to record.`)) upd((d) => L({ ...d, voted: d.voted.filter((x) => x.id !== v.id) }, "Voter reset", v.name + " (" + cname(d, v.churchId) + ")")); };
  return html`<${Sec} title="Support">
    <div><h3 className="font-bold text-white mb-2">Audit logs (latest 25)</h3><div className="space-y-2 max-h-60 overflow-y-auto">${db.audit.length === 0 && html`<p className="text-sm text-slate-500 italic">Nothing recorded yet.</p>`}${db.audit.slice(0, 25).map((a) => html`<div key=${a.id} className=${row}><span><strong className="text-white">${a.action}</strong> · ${fmt(a.time)}<br />${a.detail}</span></div>`)}</div></div>
    <div><h3 className="font-bold text-white mb-2">Reset single voter</h3><p className="text-xs text-amber-300 mb-2">⚠ This action will be logged.</p><input placeholder="Search voters who have voted" value=${q} onChange=${(e) => setQ(e.target.value)} className=${inp + " mb-2"} />
      <div className="space-y-2 max-h-60 overflow-y-auto">${vs.length === 0 && html`<p className="text-sm text-slate-500 italic">No matching voters who have voted.</p>`}${vs.map((v) => html`<div key=${v.id} className=${row}><span><strong className="text-white">${v.name}</strong> · ${cname(db, v.churchId)}</span><button onClick=${() => reset(v)} className=${dbtn}>Reset</button></div>`)}</div></div>
    <details className="bg-slate-900 border border-slate-800 rounded-xl p-3 text-sm text-slate-300"><summary className="cursor-pointer font-semibold text-white">View help</summary>
      <ul className="list-disc pl-5 mt-2 space-y-1 text-xs"><li>Organizations & Requests: add churches, approve requests, view voters.</li><li>Live Monitor: watch status and turnout, reset one church's votes.</li><li>Results: view results per church; declarations come from each Church Sub-Admin.</li><li>Settings: voters, sub-admins, passcodes, candidates and system tools.</li><li>Lost a passcode? Change it under Church Passcodes and share the new one.</li></ul></details><//>`;
}

function Danger({ db, upd, say }) {
  const [cid, setCid] = useState(""), [ph, setPh] = useState(""), [pw, setPw] = useState(""), ch = db.churches.find((c) => c.id === cid);
  const run = async (e) => {
    e.preventDefault(); if (!ch) return say("Choose a church first.");
    if (ph.trim().toLowerCase() !== ch.name.toLowerCase()) return say("Type the church name exactly to continue.");
    if (!(await checkAdmin(pw))) return say("Incorrect admin password.");
    upd((d) => L({ ...d, votes: d.votes.filter((v) => v.church !== ch.id), voted: d.voted.filter((v) => v.church !== ch.id) }, "Church votes reset", ch.name));
    setCid(""); setPh(""); setPw(""); say("All votes for " + ch.name + " were reset.");
  };
  return html`<details className=${card + " !border-red-500/50"}><summary className="cursor-pointer text-lg font-bold text-red-400">6. Danger Zone</summary><div className="mt-4 space-y-3">
    <h3 className="font-bold text-white">Reset Single Church</h3>
    <select value=${cid} onChange=${(e) => { setCid(e.target.value); setPh(""); setPw(""); }} className=${inp}><option value="">Choose church</option>${db.churches.map((c) => html`<option key=${c.id} value=${c.id}>${c.name}</option>`)}</select>
    ${ch && html`<form onSubmit=${run} className="space-y-2 bg-red-500/10 border border-red-500/40 rounded-xl p-3"><p className="text-sm text-red-200">This deletes every vote for ${ch.name} (${db.votes.filter((v) => v.church === ch.id).length}) and clears its voters' voted status. Other churches are not affected. This cannot be undone.</p>
      <input placeholder=${"Type: " + ch.name} value=${ph} onChange=${(e) => setPh(e.target.value)} className=${inp} /><input type="password" placeholder="Admin password" value=${pw} onChange=${(e) => setPw(e.target.value)} className=${inp} />
      <p className="text-xs text-amber-300">⚠ This action will be logged.</p>
      <div className="flex gap-2"><button className=${dbtn + " py-2.5"}>Reset church votes</button><button type="button" onClick=${() => setCid("")} className=${sbtn}>Cancel</button></div></form>`}
    <p className="text-xs text-slate-500">To let one voter vote again, use Reset single voter under Support.</p></div></details>`;
}

const G2 = "grid grid-cols-1 sm:grid-cols-2 gap-3";

const Fd = ({ S, k, label, type = "text", opts }) => html`<label className="block"><span className="text-xs text-slate-400">${label}</span>${opts
  ? html`<select value=${S.d[k]} onChange=${(e) => S.set(k, e.target.value)} className=${inp + " mt-1"}>${opts.map((o) => html`<option key=${o}>${o}</option>`)}</select>`
  : html`<input type=${type} min=${type === "number" ? 0 : undefined} value=${S.d[k]} onChange=${(e) => S.set(k, type === "number" ? Number(e.target.value) : e.target.value)} className=${inp + " mt-1"} />`}</label>`;
const ROLES = ["Sub-Admin", "Treasurer", "Secretary", "Member"], PERMS = ["View members", "Edit members", "Manage elections", "Manage finance", "Send broadcasts"];
const RoleMatrix = ({ S }) => {
  const r = S.d.roles || {}, on = (ro, p) => r[ro + "|" + p] ?? ro === "Sub-Admin";
  return html`<div className="overflow-x-auto"><table className="w-full text-xs text-slate-300"><thead><tr><th className="text-left p-2">Permission</th>${ROLES.map((ro) => html`<th key=${ro} className="p-2">${ro}</th>`)}</tr></thead>
    <tbody>${PERMS.map((p) => html`<tr key=${p} className="border-t border-slate-800"><td className="p-2">${p}</td>${ROLES.map((ro) => html`<td key=${ro} className="p-2 text-center"><input type="checkbox" aria-label=${ro + " " + p} checked=${on(ro, p)} onChange=${(e) => S.set("roles", { ...r, [ro + "|" + p]: e.target.checked })} className="w-4 h-4 accent-amber-500" /></td>`)}</tr>`)}</tbody></table></div>`;
};
function PeopleRoles({ db, upd }) {
  const [q, setQ] = useState(""), list = db.subs.filter((x) => (x.name + " " + x.user).toLowerCase().includes(q.trim().toLowerCase()));
  const tog = (x) => upd((d) => L({ ...d, subs: d.subs.map((y) => (y.id === x.id ? { ...y, suspended: !y.suspended } : y)) }, x.suspended ? "Sub-admin reinstated" : "Sub-admin suspended", x.user));
  return html`<${Sec} title="Manage People">
    <input placeholder="Search sub-admins by name or username" value=${q} onChange=${(e) => setQ(e.target.value)} className=${inp} />
    <div className="space-y-2">${list.length === 0 && html`<p className="text-sm text-slate-500 italic">No people found.</p>`}
      ${list.map((x) => html`<div key=${x.id} className=${row}><span><strong className="text-white">${x.name}</strong> · ${x.user} · ${cname(db, x.churchId)} ${x.suspended && html`<span className="text-red-300">(suspended)</span>`}</span><button onClick=${() => tog(x)} className=${x.suspended ? sbtn : dbtn}>${x.suspended ? "Reinstate" : "Suspend"}</button></div>`)}</div>
    <p className="text-xs text-slate-500">Suspending sets a suspended flag on the sub-admin record. To change a passcode, use Governance → Organization Passcodes.</p><//>`;
}
function SettingsTabs(P) {
  const load = () => { try { return { ...SET_DEFAULTS, ...JSON.parse(localStorage.getItem(SETKEY) || "{}") }; } catch { return { ...SET_DEFAULTS }; } };
  const tab = P.stab || "general", [saved, setSaved] = useState(load), [d, setD] = useState(saved);
  const S = { d, set: (k, v) => setD((x) => ({ ...x, [k]: v })) }, dirty = JSON.stringify(d) !== JSON.stringify(saved);
  const dr = React.useRef({ d, saved }); dr.current = { d, saved };
  useAgc((A) => A.prefsWatch((v) => { if (!v) return; const n = { ...SET_DEFAULTS, ...v }, c = dr.current; setSaved(n); if (JSON.stringify(c.d) === JSON.stringify(c.saved)) setD(n); }), []);
  const save = () => { if (!window.agcAdmin) return P.say("Still connecting to Firebase. Try again.");
    window.agcAdmin.setPrefs(d).then(() => { try { localStorage.setItem(SETKEY, JSON.stringify(d)); } catch {} setSaved(d); P.upd((x) => L(x, "System settings saved", "")); P.say("Settings saved to Firebase."); }).catch((x) => P.say("Could not save: " + x.message)); };
  const cancel = () => { setD(saved); P.say("Changes discarded."); };
  const pane = {
    general: html`<${SystemCfg} ...${P} />
      <${Sec} title="Platform"><div className=${G2}><${Fd} S=${S} k="orgType" label="Organization types supported" opts=${["Churches / Religious Entities", "Schools & Academic Institutions", "Clubs & Custom Organizations"]} /></div>
        <${Tg} S=${S} k="personal" label="Personal mode" hint="Use the platform for one person or household instead of an organization." /><//>`,
    governance: html`<${Sec} title="Election Portal & Voting">
        <${Tg} S=${S} k="electionOpen" label="Election portal open" hint="Voters can enter active elections." />

/* ---- Election lock: live at /elections/{organizationId}/status ("ACTIVE" | "LOCKED") ---- */

  const [busy, setBusy] = useState(false), locked = lockOf(elec, id) === "LOCKED", info = (elec || {})[id] || {};

    if (!window.agcAdmin || !window.agcAdmin.setLock) return say("Still connecting to Firebase.");

    setBusy(true);
    try { await window.agcAdmin.setLock(id, locked ? "ACTIVE" : "LOCKED"); upd((d) => L(d, locked ? "Election unlocked" : "Election locked", label)); say(label + " is now " + (locked ? "ACTIVE" : "LOCKED") + "."); }
    catch (x) { console.error("[Firebase] elections/" + id + "/status:", x); say("Could not update the lock: " + x.message); }
    setBusy(false);
  };

    <div className="min-w-0"><p className="text-sm font-semibold text-white break-words">${label}</p><p className="text-xs text-slate-500">${info.updatedAt ? "Updated " + fmt(info.updatedAt) + (info.updatedBy ? " by " + info.updatedBy : "") : "No lock change recorded yet"}</p></div>

}

<script type="module">

const fdb = getDatabase(fbApp), P = (p) => ref(fdb, p);

/* Firebase add-on: mirrors the admin's saved data (the same data the page already keeps) to Firebase and back. The page's own code is unchanged. */
const DB = "agc_admin_db", KEY = "agc_admin_payments";
const vals = (o) => Object.entries(o || {}).map(([id, x]) => ({ id, ...x }));
const nest = (o, f) => Object.entries(o || {}).flatMap(([k, m]) => Object.entries(m || {}).map(([id, x]) => f(k, id, x)));
const fromTree = (v) => ({
  churches: vals(v.churches), subs: vals(v.subs),
  election: v.election ? { ...v.election, released: !!v.election.released, positions: vals(v.positions).map((p) => ({ ...p, cands: p.cands || [] })) } : null,
  voters: nest(v.members, (c, id, x) => ({ ...x, id, churchId: c })),
  votes: nest(v.votes, (c, id, x) => ({ ...x, id, church: c, time: x.hr, device: "online", voter: "Anonymous" })),
  voted: nest(v.voted, (c, id, x) => ({ ...x, id, church: c })),

  audit: vals(v.audit).sort((a, b) => String(b.time).localeCompare(String(a.time))), cs: v.churchSettings || {} });
const flat = (d) => { const o = {};
  d.churches.forEach((c) => (o["churches/" + c.id] = { name: c.name, blocked: !!c.blocked, ...(c.location ? { location: c.location } : {}), ...(c.contacts ? { contacts: c.contacts } : {}) }));
  d.subs.forEach((s) => { o["subs/" + s.id] = { name: s.name, user: s.user, hash: s.hash, churchId: s.churchId }; o["passLogins/" + s.hash] = { c: s.churchId }; o["subLogins/" + s.user] = { name: s.name, hash: s.hash, churchId: s.churchId }; });
  if (d.election) { const e = d.election; o.election = { name: e.name, status: e.status, released: !!e.released }; e.positions.forEach((p) => (o["positions/" + p.id] = { title: p.title, scope: p.scope, cands: p.cands })); }
  d.voters.forEach((v) => { o["members/" + v.churchId + "/" + v.id] = { name: v.name, phone: v.phone || "", role: v.role || "Communicant", code: v.code || "" }; if (v.code) o["codes/" + v.code] = { c: v.churchId, m: v.id }; });

  d.candidates.forEach((c) => (o["candidates/" + c.church + "/" + c.id] = { name: c.name, idNo: c.idNo, phone: c.phone, pic: c.pic, posId: c.posId, bio: c.bio, status: c.status }));

  Object.keys(b).forEach((k) => { if (j(a[k]) !== j(b[k])) u[k] = JSON.parse(j(b[k])); });
  Object.keys(a).forEach((k) => { if (!(k in b)) u[k] = null; });

const applySnap = (s) => {
  const v = s.val() || {}, db = fromTree(v), pay = vals(v.payments);

  prev = flat(db); prevPay = payFlat(pay); loaded = true;
  if (!healed) { healed = true; const fix = {};

  polWatch: (cb) => onValue(ref(fdb, "operations_policies"), (s) => cb(s.val() || {}), () => cb({})),

  msgWatch: (cb) => onValue(ref(fdb, "member_messages"), (s) => cb(vals(s.val())), () => cb([])),

  aiWatch: (cb) => onValue(ref(fdb, "ai_assistant_chats"), (s) => cb(vals(s.val())), () => cb([])),

  aiImg: (id) => get(ref(fdb, "ai_assistant_images/" + id)).then((s) => s.val()),
